<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add a Pizzeria — NYC Pizza Map</title>
<meta name="description" content="Know a great NYC pizzeria that should be on the map? Tell us about it." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,600&family=Oswald:wght@600;700&family=Poppins:wght@700;800;900&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="content-page">

<header class="topbar">
  <div class="topbar-brand">
    <a href="index.html"><img class="topbar-logo" src="assets/logo-header.png" alt="NYC Pizza Map" /></a>
    <span class="topbar-name"><span class="h1-red">NYC</span> <span class="h1-green">Pizza Map</span></span>
  </div>
    <nav class="topbar-nav" id="siteNav" aria-label="Site">
    <a href="index.html">Map</a>
    <a href="store.html">Store</a>
    <a href="how-to-make-pizza.html">How To Make Pizza</a>
    <a href="suggest.html" class="active">Suggest a Spot</a>
    <a href="about.html">About</a>
  </nav>
  <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="siteNav" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>
</header>

<div class="mobile-nav-drawer" id="mobileNav" hidden>
  <a href="index.html">Map</a>
  <a href="store.html">Store</a>
  <a href="how-to-make-pizza.html">How To Make Pizza</a>
  <a href="suggest.html">Suggest a Spot</a>
  <a href="about.html">About</a>
</div>

<main class="page-wrap">
  <p class="page-kicker">Know a great one?</p>
  <h2>Add a Pizzeria</h2>
  <p>Think something's missing from the map? Make your case. If it's good enough, it gets on the list.</p>

  <form class="suggest-form" name="add-a-pizzeria" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/suggest-thanks.html">
    <p hidden><label>Don't fill this out: <input name="bot-field" /></label></p>

    <div class="form-field">
      <label for="pizzeria-name">Pizzeria name <span class="required">*</span></label>
      <input type="text" id="pizzeria-name" name="pizzeria-name" placeholder="e.g. Lucali" required />
    </div>

    <div class="form-field">
      <label for="borough">Borough <span class="required">*</span></label>
      <select id="borough" name="borough" required>
        <option value="" disabled selected>Select a borough</option>
        <option value="Brooklyn">Brooklyn</option>
        <option value="Manhattan">Manhattan</option>
        <option value="Queens">Queens</option>
        <option value="Bronx">Bronx</option>
        <option value="Staten Island">Staten Island</option>
      </select>
    </div>

    <div class="form-field">
      <label for="address">Address <span class="required">*</span></label>
      <input type="text" id="address" name="address" placeholder="e.g. 575 Henry St, Brooklyn, NY 11231" required />
    </div>

    <div class="form-field">
      <label for="reason">Why it should be on the map <span class="required">*</span></label>
      <textarea id="reason" name="reason" rows="5" placeholder="What makes it great? What should people order?" required></textarea>
    </div>

    <div class="form-field">
      <label for="email">Your email <span class="optional">(optional — only if you want a reply)</span></label>
      <input type="email" id="email" name="email" placeholder="you@example.com" />
    </div>

    <button type="submit" class="form-submit">Submit →</button>
  </form>
</main>

<script src="nav.js"></script>
</body>
</html>
